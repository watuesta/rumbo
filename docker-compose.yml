# Stack de Rumbo para Portainer (Stacks > Add stack > Repository).
# Las variables ${...} se cargan en la sección "Environment variables" del stack.
services:
  web:
    build: .
    image: rumbo-web:latest
    restart: unless-stopped
    ports:
      - "8130:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Define ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Define CSRF_TRUSTED_ORIGINS}
      POSTGRES_DB: ${POSTGRES_DB:-rumbo}
      POSTGRES_USER: ${POSTGRES_USER:-rumbo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rumbo}
      POSTGRES_USER: ${POSTGRES_USER:-rumbo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - rumbo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Respalda la base de datos con pg_dump al arrancar y luego cada 24 horas, en
  # BACKUP_DIR del NAS. Reiniciar este contenedor fuerza un respaldo inmediato.
  # El script va aquí porque Portainer CE no monta archivos del repo.
  backup:
    image: postgres:17
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-rumbo}
      PGUSER: ${POSTGRES_USER:-rumbo}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      RETENCION_DIAS: ${BACKUP_RETENCION_DIAS:-30}
      TZ: America/Bogota
    volumes:
      - ${BACKUP_DIR:?Define BACKUP_DIR}:/respaldos
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          archivo="/respaldos/rumbo-$$(date +%Y-%m-%d_%H%M).dump"
          if pg_dump --format=custom --file="$$archivo.tmp"; then
            mv "$$archivo.tmp" "$$archivo"
            echo "Respaldo creado: $$archivo ($$(du -h "$$archivo" | cut -f1))"
          else
            rm -f "$$archivo.tmp"
            echo "ERROR: no se pudo crear el respaldo" >&2
          fi
          find /respaldos -name 'rumbo-*.dump' -mtime +$$RETENCION_DIAS -delete
          sleep 86400
        done

volumes:
  rumbo_pgdata:
